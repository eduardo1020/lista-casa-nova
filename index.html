<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://kllfxffqcaueumypkzet.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WdpnA3lz9-6LXhk1WfjGqg_irtE9vbL";
const PIX_KEY = "eduardofilipe538@gmail.com";
const PIX_NAME = "Eduardo Filipe de Melo Cassiano";

const ITEMS = [
  { "id": "jogo-facas", "name": "Jogo de facas", "url": "https://br.shp.ee/1w5yfuVz" },
  { "id": "tabua-corte", "name": "Tábua de corte", "url": "https://br.shp.ee/2k4cup7g" },
  { "id": "aparelho-jantar", "name": "Aparelho de jantar", "url": "https://br.shp.ee/F3VS5Kbw" },
  { "id": "copos", "name": "Copos", "url": "https://br.shp.ee/1HemRkSm" },
  { "id": "xicaras", "name": "Xícaras", "url": "https://br.shp.ee/wuqKCiDd" },
  { "id": "jogo-sobremesa", "name": "Jogo de sobremesa", "url": "https://br.shp.ee/PtvuSedi" },
  { "id": "travessa-marinex", "name": "Travessa marinex", "url": "https://br.shp.ee/tKqAxaWK" },
  { "id": "jogo-panelas", "name": "Jogo de panelas", "url": "https://a.co/d/00dQWEhu" },
  { "id": "panela-pressao", "name": "Panela de pressão", "url": "https://br.shp.ee/orEQdXLW" },
  { "id": "forma-assar", "name": "Forma para assar", "url": "https://br.shp.ee/tFJkaif5" },
  { "id": "liquidificador", "name": "Liquidificador", "url": "https://br.shp.ee/8P5XabX6" },
  { "id": "manta-sofa", "name": "Manta para sofá", "url": "https://br.shp.ee/Smndtcw9" },
  { "id": "almofadas", "name": "Almofadas", "url": "https://br.shp.ee/AxnYLvnh" }
];

let showAll = false, client = null;
let claimsMap = new Map(); // Guarda { item_id: { claimed_by, claim_token } }

const root = document.getElementById("items");
const statusEl = document.getElementById("status");
const warning = document.getElementById("setupWarning");

const ready = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("COLE_AQUI") && !SUPABASE_ANON_KEY.includes("COLE_AQUI");
document.getElementById("pixKey").textContent = PIX_KEY;
document.getElementById("pixName").textContent = "Destinatário: " + PIX_NAME;

// Gera ou recupera um token único para o navegador do usuário
function getMyToken() {
  let token = localStorage.getItem("my_gift_token");
  if (!token) {
    token = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem("my_gift_token", token);
  }
  return token;
}

function render(){
 root.innerHTML = "";
 const visible = ITEMS.filter(x => showAll || !claimsMap.has(x.id));
 statusEl.textContent = `${ITEMS.length - claimsMap.size} de ${ITEMS.length} presentes disponíveis`;
 document.getElementById("toggle").textContent = showAll ? "Mostrar disponíveis" : "Mostrar todos";

 if (!visible.length) {
   root.innerHTML = '<div class="notice">Todos os presentes já foram reservados. Obrigado pelo carinho! ♡</div>';
   return;
 }

 const myToken = getMyToken();

 visible.forEach(item => {
  const claimData = claimsMap.get(item.id);
  const isClaimed = !!claimData;
  const isMyClaim = isClaimed && (claimData.claim_token === myToken);

  const card = document.createElement("article");
  card.className = "item" + (isClaimed ? " claimed" : "");

  const info = document.createElement("div");
  info.className = "info";

  const h = document.createElement("h2");
  h.textContent = item.name;
  info.appendChild(h);

  if (isClaimed) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = `Reservado por ${claimData.claimed_by || 'um convidado'}`;
    info.appendChild(tag);
  }

  const links = document.createElement("div");
  links.className = "links";
  const a = document.createElement("a");
  a.className = "btn buy";
  a.href = item.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = "Ver produto ↗";
  links.appendChild(a);
  info.appendChild(links);

  const b = document.createElement("button");
  
  if (!isClaimed) {
    b.className = "primary claim";
    b.textContent = "Vou presentear";
    b.disabled = !client;
    b.addEventListener("click", () => claimItem(item));
  } else if (isMyClaim) {
    b.className = "secondary claim";
    b.textContent = "Desfazer minha reserva";
    b.disabled = !client;
    b.addEventListener("click", () => unclaimItem(item, claimData.claim_token));
  } else {
    b.className = "secondary claim";
    b.textContent = "Reservado";
    b.disabled = true; // Desativado para quem não é o dono da reserva
  }

  card.append(info, b);
  root.appendChild(card);
 });
}

async function loadClaims(){
 if (!client) {
   warning.classList.remove("hidden");
   statusEl.textContent = "Configuração pendente";
   render();
   return;
 }
 warning.classList.add("hidden");
 const { data, error } = await client.from("gift_claims").select("item_id, claimed_by, claim_token");
 
 if (error) {
   statusEl.textContent = "Erro ao carregar a lista";
   warning.classList.remove("hidden");
   console.error(error);
   return;
 }
 
 claimsMap = new Map((data || []).map(x => [x.item_id, { claimed_by: x.claimed_by, claim_token: x.claim_token }]));
 render();
}

async function claimItem(item) {
 const name = prompt("Digite seu nome para confirmar a reserva do presente:");
 if (!name || !name.trim()) return;

 const myToken = getMyToken();
 const { error } = await client.from("gift_claims").insert({
   item_id: item.id,
   claimed_by: name.trim(),
   claim_token: myToken
 });

 if (error) {
   alert(error.code === "23505" ? "Esse presente acabou de ser reservado por outra pessoa." : "Não foi possível reservar agora. Tente novamente.");
 }
 await loadClaims();
}

async function unclaimItem(item, token) {
 const myToken = getMyToken();
 if (token !== myToken) {
   alert("Apenas a pessoa que reservou este presente pode desfazer a reserva neste aparelho.");
   return;
 }

 if (!confirm("Tem certeza que deseja cancelar a reserva deste presente?")) return;

 const { error } = await client.from("gift_claims").delete().eq("item_id", item.id).eq("claim_token", myToken);
 if (error) {
   alert("Não foi possível desfazer a reserva.");
 }
 await loadClaims();
}

document.getElementById("toggle").addEventListener("click", () => { showAll = !showAll; render(); });

const dlg = document.getElementById("pixDialog");
document.getElementById("pixOpen").addEventListener("click", () => dlg.showModal());
document.getElementById("closePix").addEventListener("click", () => dlg.close());
document.getElementById("copyPix").addEventListener("click", async () => {
 try {
   await navigator.clipboard.writeText(PIX_KEY);
   document.getElementById("pixMessage").textContent = "Chave Pix copiada!";
 } catch(e) {
   document.getElementById("pixMessage").textContent = "Copie manualmente a chave acima.";
 }
});

if (ready) {
 client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 loadClaims();
 client.channel("gift-claims-live").on("postgres_changes", { event: "*", schema: "public", table: "gift_claims" }, () => loadClaims()).subscribe();
} else {
 loadClaims();
}
</script>
